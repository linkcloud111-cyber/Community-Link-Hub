name = "linkcloud-cleanup-scheduler"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[triggers]
crons = ["*/15 * * * *"]

[vars]
CLEANUP_ENDPOINT_URL = "https://community-link-hub.pages.dev/api/admin/cleanup-unverified"

# The CRON_SECRET must be set via Cloudflare Dashboard or:
# wrangler secret put CRON_SECRET
